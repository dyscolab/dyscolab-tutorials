[workspace]
authors = ["Oliverio Starosta <oliveriostarosta@gmail.com>"]
channels = ["conda-forge"]
name = "dyscolab-tutorials"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
update-dependencies = "pixi run python set_dependencies.py"
test-tutorials = "python test_tutorials.py"

[tasks.open]
args = [{ "arg" = "path", "default" = "" }]
cmd = "marimo edit --no-sandbox {{path}}"

[environments]
default = []
local = ["local"]

[dependencies]
numpy = ">=2.4.2"
matplotlib = "*"
ipykernel = "*"
ipywidgets = "*"
marimo = ">=0.20.2"
pyzmq = ">=27.1.0"
seaborn = "*"

[pypi-dependencies]
rebop = "*"
symbolite = ">=1.1.1"
poincare = ">=1.2.0"
simbio = ">= 1.2.0"
jablonski = ">= 0.4.0"

[feature.local.dependencies]
uv = "*"
 
# Automatically prepends local repos to Python's module search path in the `local` env.
[feature.local.target.unix.activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}/../u2602/symbolite/src:${PIXI_PROJECT_ROOT}/../u2602/poincare/src:${PIXI_PROJECT_ROOT}/../u2602/simbio/src:${PIXI_PROJECT_ROOT}/../u2602/jablonski/src:${PYTHONPATH}"

[feature.local.target.win.activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}/../u2602/symbolite/src;${PIXI_PROJECT_ROOT}/../u2602/poincare/src;${PIXI_PROJECT_ROOT}/../u2602/simbio/src;${PIXI_PROJECT_ROOT}/../u2602/jablonski/src;${PYTHONPATH}"