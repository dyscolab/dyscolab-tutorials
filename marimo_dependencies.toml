# File to set dependencies in setup cells in marimo noteboks for when they run 
# in the marimo playground. Fromat dependencies:
# [group-name]
# dependencies = [dependencies as would be passed to micropip.install]
# files = [relative paths to files]
# and run:
# pixi run update-dependencies
# to update them in the files

[base-poincare]
dependencies = [
    "pint_pandas<=0.7",
    "typing_extensions>=4.15.0",
    "poincare>=1.3.0",
    "matplotlib",
]
files = [
    "poincare/asymptotic_behaviour.py",
    "poincare/composing.py",
    "poincare/fitting.py",
    "poincare/getting_started_with_poincare.py",
    "poincare/simulation.py",
    "poincare/units.py",
    "examples/excitabilty.py",
]

[base-simbio]
dependencies = [
    "pint_pandas<=0.7",
    "typing_extensions>=4.15.0",
    "simbio>=1.3.0",
    "matplotlib",
]
files = [
    "simbio/getting_started_with_simbio.py",
    "simbio/repressilator.py",
    "simbio/sbml.py",
    "simbio/using_volume.py",
]

[simbio-rebop]
dependencies = [
    "pint_pandas<=0.7",
    "typing_extensions>=4.15.0",
    "simbio>=1.3.0",
    "matplotlib",
    "seaborn",
]
files = ["simbio/stochastic.py"]

[base-jablonski]
dependencies = [
    "pint_pandas<=0.7",
    "typing_extensions>=4.15.0",
    "jablonski>=0.5.0",
    "matplotlib",
]
files = [
    "jablonski/fitting_spectroscopic_data.py",
    "jablonski/getting_started_with_jablonski.py",
    "jablonski/spectroscopic_simulations.py",
]

[jablonski-rebop]
dependencies = [
    "pint_pandas<=0.7",
    "typing_extensions>=4.15.0",
    "jablonski>=0.5.0",
    "matplotlib",
    "rebop",
]
files = ["jablonski/stochastic_photon_counting.py"]
